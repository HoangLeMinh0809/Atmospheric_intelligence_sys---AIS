hanoi:
  bbox:
    west: 105.25
    east: 106.10
    south: 20.55
    north: 21.40
  center:
    lat: 21.0285
    lon: 105.8542

pm25_qc:
  min_value: 0.0
  max_value: 1000.0
  min_coverage_pct: 50.0

era5:
  region:
    west: 95.0
    east: 115.0
    south: 5.0
    north: 35.0
  raw_base_path: "hdfs://namenode:9000/raw/era5"
  surface_variables:
    - "10m_u_component_of_wind"
    - "10m_v_component_of_wind"
    - "boundary_layer_height"
    - "surface_pressure"
    - "2m_temperature"
    - "2m_dewpoint_temperature"
    - "total_precipitation"
    - "mean_sea_level_pressure"
  pressure_level_variables:
    - u_component_of_wind
    - v_component_of_wind
    - vertical_velocity
    - geopotential
    - temperature
    - specific_humidity
  pressure_levels:
    - 1000
    - 925
    - 850
    - 700
    - 600
    - 500
    - 400
  pressure_levels_time_utc: ["00:00", "06:00", "12:00", "18:00"]

sentinel5p:
  raw_base_path: "hdfs://namenode:9000/raw/sentinel5p"
  products:
    - "NO2"
    - "CO"
    - "SO2"
    - "O3"
    - "AER_AI"

maiac:
  raw_base_path: "hdfs://namenode:9000/raw/maiac"
  local_fallback_path: "crawler/maiac_data"
  scale_factor: 0.001
  bands:
    - "AOD_047"
    - "AOD_055"

gold:
  horizons_hours:
    - 6
    - 12
    - 24
  lag_hours:
    - 1
    - 3
    - 6
    - 12
    - 24
  rolling_hours:
    - 3
    - 6
    - 24

hysplit:
  backward_hours: 72
  forward_hours: 24
  # Runtime-safe defaults for local/full-stack demos. Increase gradually for production runs.
  backward_altitudes_m: [500]
  forward_altitudes_m: [500]
  init_offsets_deg:
    lat: [0.0]
    lon: [0.0]
  run_hours_utc: [0, 12]
  meteo_interval_hours: 6
  pm25_trigger_threshold: 75

trajectory:
  anchor_hours: [0, -6, -12, -24, -36, -48, -60, -72]
  cluster_k_min: 3
  cluster_k_max: 10
  cluster_k_default: 6

sampling:
  path_window_start_h: -72
  path_window_end_h: -24
  max_distance_deg: 0.25
  spatial_bucket_deg: 0.25

visualization:
  product_version: "windy_v1"
  schema_version: "1"
  region_bbox:
    west: 100.0
    east: 108.8
    south: 18.0
    north: 24.5
  region_center:
    lat: 21.0285
    lon: 105.8542
  default_zoom: 7
  grid_resolution_deg: 0.15
  horizons_hours: [0, 6, 12, 24]
  observation_history_hours: 48
  freshness_max_minutes: 360
  max_trajectories: 150
  max_points_per_trajectory: 100
  max_geojson_features: 5000
  forward_plume_required: false
  cache:
    base_uri: "hdfs://namenode:9000/visualization_cache"
    format: "geojson"
  source_cluster_labels:
    "0": "Unknown/weak trajectory signal"
    "1": "Northwest uplands transport corridor"
    "2": "Red River Delta urban-industrial corridor"
    "3": "Northeast coastal/Quang Ninh corridor"
    "4": "Southwest agricultural and biomass-burning corridor"
    "5": "Local Hanoi recirculation"
    "6": "Long-range regional transport"
