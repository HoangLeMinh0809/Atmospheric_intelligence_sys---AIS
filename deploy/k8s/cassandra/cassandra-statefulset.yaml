apiVersion: v1
kind: Service
metadata:
  name: cassandra-headless
  namespace: ais
  labels:
    app.kubernetes.io/name: cassandra
    app.kubernetes.io/part-of: atmospheric-intelligence-system
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: cassandra
  ports:
    - name: cql
      port: 9042
      targetPort: cql
    - name: intra-node
      port: 7000
      targetPort: intra-node
    - name: tls-intra-node
      port: 7001
      targetPort: tls-intra-node
---
apiVersion: v1
kind: Service
metadata:
  name: cassandra
  namespace: ais
  labels:
    app.kubernetes.io/name: cassandra
    app.kubernetes.io/part-of: atmospheric-intelligence-system
spec:
  selector:
    app.kubernetes.io/name: cassandra
  ports:
    - name: cql
      port: 9042
      targetPort: cql
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cassandra
  namespace: ais
  labels:
    app.kubernetes.io/name: cassandra
    app.kubernetes.io/part-of: atmospheric-intelligence-system
spec:
  serviceName: cassandra-headless
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cassandra
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cassandra
        app.kubernetes.io/part-of: atmospheric-intelligence-system
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: cassandra
          image: cassandra:4.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: cql
              containerPort: 9042
            - name: intra-node
              containerPort: 7000
            - name: tls-intra-node
              containerPort: 7001
          env:
            - name: CASSANDRA_CLUSTER_NAME
              value: ais-cluster
            - name: CASSANDRA_DC
              value: dc1
            - name: CASSANDRA_RACK
              value: rack1
            - name: CASSANDRA_ENDPOINT_SNITCH
              value: GossipingPropertyFileSnitch
            - name: CASSANDRA_SEEDS
              value: cassandra-0.cassandra-headless.ais.svc.cluster.local
            - name: MAX_HEAP_SIZE
              value: 512M
            - name: HEAP_NEWSIZE
              value: 128M
          readinessProbe:
            exec:
              command:
                - /bin/bash
                - -lc
                - cqlsh -e 'DESCRIBE KEYSPACES'
            initialDelaySeconds: 45
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 12
          livenessProbe:
            tcpSocket:
              port: cql
            initialDelaySeconds: 90
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 300m
              memory: 768Mi
            limits:
              cpu: "1"
              memory: 2Gi
          volumeMounts:
            - name: cassandra-data
              mountPath: /var/lib/cassandra
      volumes:
        - name: cassandra-data
          emptyDir: {}
