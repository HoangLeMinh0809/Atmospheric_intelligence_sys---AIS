apiVersion: apps/v1
kind: Deployment
metadata:
  name: ais-ui
  namespace: ais
  labels:
    app.kubernetes.io/name: ais-ui
    app.kubernetes.io/part-of: atmospheric-intelligence-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ais-ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ais-ui
        app.kubernetes.io/part-of: atmospheric-intelligence-system
    spec:
      containers:
        - name: ui
          image: ais-ui:local
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 80
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
