apiVersion: apps/v1
kind: Deployment
metadata:
  name: visualization-api
  namespace: ais
  labels:
    app.kubernetes.io/name: visualization-api
    app.kubernetes.io/part-of: atmospheric-intelligence-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: visualization-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: visualization-api
        app.kubernetes.io/part-of: atmospheric-intelligence-system
    spec:
      serviceAccountName: ais-workload
      containers:
        - name: visualization-api
          image: ais-visualization-api:local
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: ais-runtime-config
            - secretRef:
                name: ais-runtime-secrets
                optional: true
          ports:
            - name: http
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            timeoutSeconds: 5
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 10
            timeoutSeconds: 5
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
