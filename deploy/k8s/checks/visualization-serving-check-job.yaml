apiVersion: batch/v1
kind: Job
metadata:
  name: visualization-serving-check
  namespace: ais
  labels:
    app.kubernetes.io/name: visualization-serving-check
    app.kubernetes.io/part-of: atmospheric-intelligence-system
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: visualization-serving-check
    spec:
      serviceAccountName: ais-workload
      restartPolicy: Never
      containers:
        - name: check
          image: ais-ml-runtime:local
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: ais-runtime-config
            - secretRef:
                name: ais-runtime-secrets
                optional: true
          command: ["python"]
          args:
            - scripts/check_visualization_serving.py
            - --base-url
            - http://visualization-api.ais.svc.cluster.local
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
