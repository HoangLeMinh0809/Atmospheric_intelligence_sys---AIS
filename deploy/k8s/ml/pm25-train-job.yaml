apiVersion: batch/v1
kind: Job
metadata:
  name: pm25-train
  namespace: ais
  labels:
    app.kubernetes.io/name: pm25-train
    app.kubernetes.io/part-of: atmospheric-intelligence-system
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pm25-train
    spec:
      serviceAccountName: ais-workload
      restartPolicy: Never
      containers:
        - name: train
          image: ais-ml-runtime:local
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: ais-runtime-config
            - secretRef:
                name: ais-runtime-secrets
                optional: true
          command: ["python"]
          args:
            - ml/train_hanoi_pm25.py
            - --dataset-version
            - $(DATASET_VERSION)
            - --feature-set-name
            - $(FEATURE_SET_NAME)
            - --model-type
            - $(MODEL_TYPE)
            - --output-dir
            - $(MODEL_ARTIFACT_BASE_URI)/hanoi_pm25
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 4Gi
