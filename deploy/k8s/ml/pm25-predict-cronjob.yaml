apiVersion: batch/v1
kind: CronJob
metadata:
  name: pm25-predict
  namespace: ais
  labels:
    app.kubernetes.io/name: pm25-predict
    app.kubernetes.io/part-of: atmospheric-intelligence-system
spec:
  schedule: "15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app.kubernetes.io/name: pm25-predict
        spec:
          serviceAccountName: ais-workload
          restartPolicy: Never
          containers:
            - name: predict
              image: ais-ml-runtime:local
              imagePullPolicy: IfNotPresent
              envFrom:
                - configMapRef:
                    name: ais-runtime-config
                - secretRef:
                    name: ais-runtime-secrets
                    optional: true
              command: ["python"]
              args:
                - ml/predict_hanoi_pm25.py
                - --dry-run
              resources:
                requests:
                  cpu: 500m
                  memory: 1Gi
                limits:
                  cpu: "1"
                  memory: 2Gi
