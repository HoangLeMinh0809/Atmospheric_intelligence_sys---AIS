apiVersion: batch/v1
kind: CronJob
metadata:
  name: pm25-predict
  namespace: ais
  labels:
    app.kubernetes.io/name: pm25-predict
    app.kubernetes.io/part-of: atmospheric-intelligence-system
spec:
  # Replaced by the sequential online-pm25-features cycle; keep suspended for manual fallback.
  schedule: "1-59/2 * * * *"
  suspend: true
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app.kubernetes.io/name: pm25-predict
        spec:
          serviceAccountName: ais-workload
          restartPolicy: Never
          containers:
            - name: predict
              image: ais-ml-runtime:local
              imagePullPolicy: IfNotPresent
              envFrom:
                - configMapRef:
                    name: ais-runtime-config
                - secretRef:
                    name: ais-runtime-secrets
                    optional: true
              env:
                # Read the latest available online feature state instead of a static hour.
                - name: BASE_TIME
                  value: ""
                - name: BASE_HOUR
                  value: ""
              command: ["/opt/spark/bin/spark-submit"]
              args:
                - --master
                - local[1]
                - --deploy-mode
                - client
                - --conf
                - spark.sql.shuffle.partitions=4
                - --conf
                - spark.default.parallelism=4
                - --conf
                - spark.sql.extensions=org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
                - --conf
                - spark.sql.catalog.ais=org.apache.iceberg.spark.SparkCatalog
                - --conf
                - spark.sql.catalog.ais.type=hadoop
                - --conf
                - spark.sql.catalog.ais.warehouse=$(ICEBERG_WAREHOUSE)
                - --conf
                - spark.hadoop.fs.defaultFS=$(HDFS_NAMENODE)
                - /opt/ais/ml/predict_hanoi_pm25.py
                - --dry-run
                - "0"
              resources:
                requests:
                  cpu: 500m
                  memory: 1Gi
                limits:
                  cpu: "1"
                  memory: 2Gi
