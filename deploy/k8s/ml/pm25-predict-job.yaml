apiVersion: batch/v1
kind: Job
metadata:
  name: pm25-predict
  namespace: ais
  labels:
    app.kubernetes.io/name: pm25-predict
    app.kubernetes.io/part-of: atmospheric-intelligence-system
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pm25-predict
    spec:
      serviceAccountName: ais-workload
      restartPolicy: Never
      hostAliases:
        - ip: "192.168.65.254"
          hostnames:
            - namenode
            - datanode
      containers:
        - name: predict
          image: ais-ml-runtime:local
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: ais-runtime-config
            - secretRef:
                name: ais-runtime-secrets
                optional: true
          command: ["python"]
          args:
            - ml/predict_hanoi_pm25.py
            - --dry-run
            - "0"
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "1"
              memory: 2Gi
